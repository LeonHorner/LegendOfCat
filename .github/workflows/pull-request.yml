name: Prepare merge
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to validate before squash merge
        required: true
        type: string
permissions:
  contents: read
  statuses: write
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  preflight:
    name: PR preflight
    # Skip Draft pushes and untrusted forks; still invalidate when a ready PR becomes Draft.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (!github.event.pull_request.draft || github.event.action == 'converted_to_draft'))
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      base: ${{ steps.pr.outputs.base }}
      title: ${{ steps.pr.outputs.title }}
    steps:
      - name: Resolve exact PR revision
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            // The same exact-head validation path handles manual and ready-PR events.
            const input = process.env.PR_NUMBER;
            const number = context.eventName === 'workflow_dispatch'
              ? (/^[1-9][0-9]*$/.test(input) ? Number(input) : NaN)
              : context.payload.pull_request?.number;
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('A valid PR number is required.');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            const repository = context.repo.owner + '/' + context.repo.repo;
            if (pr.head.repo?.full_name !== repository) {
              throw new Error('Only same-repository PR branches may use the Unity secrets.');
            }
            core.setOutput('number', String(number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            core.setOutput('title', pr.title);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, state: 'pending', context: 'merge-ready',
              description: 'Validating the exact PR revision, Unity tests and both builds.',
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main') {
              throw new Error('Use an open, ready PR targeting main; Draft PRs are not merge-ready.');
            }
            if (!/^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/.test(pr.title)) {
              throw new Error('The PR title must be an English Conventional Commit.');
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: pr.base.sha + '...' + pr.head.sha
            });
            if (comparison.behind_by !== 0) {
              throw new Error('Merge main into the feature branch before validation; never rebase published branches.');
            }
      - name: Check CI workflow contracts
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
      - name: Install workflow test dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run CI workflow contract tests
        run: node --test tools/ci-workflow.test.mjs
      - name: Check release download contracts
        run: node --test tools/release-assets.test.mjs tools/delta-release.test.mjs
      - name: Check application icons and packaging contracts
        run: node --test tools/application-icon.test.mjs
      - name: Test Linux native update supervisor with real processes
        run: node --test tools/linux-update-supervisor.test.mjs
      - name: Set up .NET for updater workflow tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run updater workflow regression tests
        run: dotnet run --project Launcher.WorkflowTests/Launcher.WorkflowTests.csproj --configuration Release
      - name: Check Unity activation
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" && test -n "$UNITY_EMAIL" && test -n "$UNITY_PASSWORD" || {
            echo "::error::Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD in Actions secrets."
            exit 1
          }
  test:
    name: Unity tests
    needs: preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-pr-test-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ needs.preflight.outputs.sha }}
          restore-keys: |
            unity-pr-test-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - uses: game-ci/unity-test-runner@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: artifacts/tests
          # Keep Unity's exit code and XML artifacts; omit the redundant neutral check.
          githubToken: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-test-results
          path: artifacts/tests
          retention-days: 3
  build:
    name: Build (${{ matrix.platform }})
    needs: preflight
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: StandaloneWindows64
            platform: win
            player: LegendOfCat.exe
            rid: win-x64
          - target: StandaloneLinux64
            platform: linux
            player: LegendOfCat
            rid: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-pr-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-${{ needs.preflight.outputs.sha }}
          restore-keys: |
            unity-pr-${{ matrix.platform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/**') }}-
      - uses: game-ci/unity-builder@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildMethod: BuildGame.Build
          versioning: Custom
          version: 0.0.1
          customParameters: -releaseVersion 0.0.1 -releaseOutput build/${{ matrix.platform }}/Game/${{ matrix.player }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check launcher download byte reporting
        run: dotnet run --project tools/LauncherProgressTests/LauncherProgressTests.csproj --configuration Release
      - name: Build self-contained launcher
        run: dotnet publish Launcher/Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:RestoreLockedMode=true -o "${{ runner.temp }}/launcher-${{ matrix.platform }}"
      - name: Prepare Linux startup validation
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
          cp -r build/linux/Game "${{ runner.temp }}/launcher-linux/Game"
          chmod +x "${{ runner.temp }}/launcher-linux/LegendOfCat" "${{ runner.temp }}/launcher-linux/Game/LegendOfCat"
      - name: Smoke test Linux payload
        if: matrix.platform == 'linux'
        shell: pwsh
        run: ./tools/smoke-test.ps1 -Executable '${{ runner.temp }}/launcher-linux/LegendOfCat' -LogPath 'artifacts/smoke/linux.log' -VirtualDisplay
      - name: Preserve Linux startup diagnostics
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-linux
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pr-player-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/Game
          retention-days: 1
  package:
    needs: [preflight, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            rid: win-x64
            executable: LegendOfCat.exe
          - os: ubuntu-22.04
            platform: linux
            rid: linux-x64
            executable: LegendOfCat
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with:
          name: pr-player-${{ matrix.platform }}
          path: publish/Game
      - name: Publish launcher
        run: |
          dotnet publish Launcher/Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=0.0.1 -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Make Linux player executable
        if: matrix.platform == 'linux'
        run: chmod +x publish/Game/LegendOfCat publish/LegendOfCat
      - name: Install virtual display for Linux startup
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
      - name: Smoke test complete payload
        run: |
          ./tools/smoke-test.ps1 -Executable 'publish/${{ matrix.executable }}' -LogPath 'artifacts/smoke/${{ matrix.platform }}.log' -VirtualDisplay:($IsLinux)
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-package-smoke-${{ matrix.platform }}
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Package installer and update feed
        run: |
          $icon = if ($IsWindows) { 'tools/icon.ico' } else { 'Assets/Game/Branding/icon.png' }
          dotnet vpk pack --packId LeonHorner.LegendOfCat --packVersion 0.0.1 --packDir publish --mainExe ${{ matrix.executable }} --runtime ${{ matrix.rid }} --channel ${{ matrix.platform }} --packTitle LegendOfCat --icon $icon --outputDir artifacts/releases/${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = 'artifacts/releases/${{ matrix.platform }}'
          if (-not (Get-ChildItem $folder -Filter '*.nupkg')) { throw 'Missing update package' }
          if (-not (Test-Path "$folder/releases.${{ matrix.platform }}.json")) { throw 'Missing update feed' }
          $extension = if ('${{ matrix.platform }}' -eq 'win') { '*Setup.exe' } else { '*.AppImage' }
          if (-not (Get-ChildItem $folder -Filter $extension)) { throw 'Missing installer/AppImage' }
      - name: Inspect embedded application and package icons
        run: ./tools/check-package-icons.ps1 -PackageDirectory 'artifacts/releases/${{ matrix.platform }}'
      - name: Exercise real mounted Linux AppImage N to N+1 update
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fuse libfuse2
          if [ ! -e /dev/fuse ]; then
            echo "::error::FUSE is unavailable on this runner; real AppImage update cannot be certified."
            exit 1
          fi
          mkdir -p artifacts/integration/next
          dotnet vpk pack --packId LeonHorner.LegendOfCat --packVersion 0.0.2 \
            --packDir publish --mainExe LegendOfCat --runtime linux-x64 \
            --channel linux --packTitle LegendOfCat \
            --icon Assets/Game/Branding/icon.png --outputDir artifacts/integration/next
          old="$(find artifacts/releases/linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          next="$(find artifacts/integration/next -maxdepth 1 -name '*-full.nupkg' -print -quit)"
          test -n "$old" && test -n "$next"
          chmod +x "$old"
          xvfb-run -a node tools/linux-appimage-update-integration.mjs "$old" "$next"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-package-${{ matrix.platform }}
          path: artifacts/releases
          retention-days: 1
  delta-integration:
    name: Real Velopack Delta (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: ubuntu-22.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet tool restore
      - name: Reconstruct a real stable full package with Velopack Delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/integration-delta.mjs ${{ matrix.platform }}
  gate:
    name: Record merge readiness
    if: always() && needs.preflight.outputs.sha != ''
    needs: [preflight, test, build, package, delta-integration]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.preflight.outputs.number }}
          CHECKED_SHA: ${{ needs.preflight.outputs.sha }}
          CHECKED_BASE: ${{ needs.preflight.outputs.base }}
          CHECKED_TITLE: ${{ needs.preflight.outputs.title }}
          PREFLIGHT: ${{ needs.preflight.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          PACKAGE: ${{ needs.package.result }}
          DELTA_INTEGRATION: ${{ needs.delta-integration.result }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            const unchanged = pr.state === 'open' && !pr.draft && pr.base.ref === 'main' &&
              pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pr.head.sha === process.env.CHECKED_SHA && pr.base.sha === process.env.CHECKED_BASE &&
              pr.title === process.env.CHECKED_TITLE;
            let currentWithBase = false;
            if (unchanged) {
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: pr.base.sha + '...' + pr.head.sha
              });
              currentWithBase = comparison.behind_by === 0;
            }
            // Matrix failure or cancellation is not success; only complete, unchanged validation passes.
            const passed = unchanged && currentWithBase &&
              ['PREFLIGHT', 'TEST', 'BUILD', 'PACKAGE', 'DELTA_INTEGRATION'].every(name => process.env[name] === 'success');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.CHECKED_SHA,
              state: passed ? 'success' : 'failure', context: 'merge-ready',
              description: passed ? 'Exact PR revision passed tests and both platform builds.' : 'Validation failed or the PR changed; prepare merge again.',
              target_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            if (!passed) core.setFailed('Merge readiness was not granted.');

